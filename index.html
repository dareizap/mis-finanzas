<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mis finanzas</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#101a2e;--soft:#64708a;--line:#dde4f0;--in:#0e9f78;--out:#e5533d;--ac:#2f4bd8;--acink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1220;--card:#141d33;--ink:#e8edf8;--soft:#94a0bd;--line:#26314e;--in:#35d6a6;--out:#ff7a66;--ac:#7c93ff;--acink:#0c1220}}
:root[data-theme="dark"]{--bg:#0c1220;--card:#141d33;--ink:#e8edf8;--soft:#94a0bd;--line:#26314e;--in:#35d6a6;--out:#ff7a66;--ac:#7c93ff;--acink:#0c1220}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
main{width:min(96vw,640px);padding:1rem 0 2.5rem}
h1{font-size:1.4rem;margin:.2rem 0 .8rem}
h2{font-size:1.05rem;margin:1.2rem 0 .5rem}
.num{font-variant-numeric:tabular-nums}
nav{display:flex;gap:.3rem;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.3rem;margin-bottom:.8rem;overflow-x:auto}
nav button{flex:1;white-space:nowrap;background:transparent;color:var(--soft);padding:.55rem .6rem}
nav button.on{background:var(--ac);color:var(--acink)}
.top{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.4rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.9rem}
.k{color:var(--soft);font-size:.85rem}.v{font-size:1.25rem;font-weight:650;margin-top:.15rem}
.in{color:var(--in)}.out{color:var(--out)}
button,input,select{font:inherit;color:var(--ink)}
button{border:0;border-radius:9px;padding:.6rem 1rem;cursor:pointer;background:var(--ac);color:var(--acink)}
button.g{background:transparent;color:var(--soft);padding:.3rem .5rem}
input,select{width:100%;padding:.6rem .7rem;border-radius:9px;border:1px solid var(--line);background:var(--bg)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
form{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
form .w{grid-column:1/-1}
.bar{height:9px;border-radius:5px;background:var(--line);overflow:hidden;margin:.35rem 0 .1rem}
.bar i{display:block;height:100%;background:var(--ac)}
.bar i.over{background:var(--out)}
.row{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.sm{font-size:.82rem;color:var(--soft)}
.empty{color:var(--soft);padding:.8rem 0}
.mini{display:flex;gap:.4rem;margin-top:.5rem}
.mini input{flex:1}
svg{width:100%;height:auto;display:block}
</style>
</head>
<body>
<main>
<h1>Mis finanzas</h1>
<nav id="nav"></nav>
<div class="top"><span class="k">Mes</span><input type="month" id="mes" style="width:auto"></div>
<div id="v"></div>
</main>
<script>
const CATS=['Comida','Transporte','Vivienda','Servicios','Salud','Ocio','Educación','Otros'];
const TABS=[['res','Resumen'],['mov','Movimientos'],['pre','Presupuesto'],['met','Metas']];
const KEY='finanzas-v1';
const def=()=>({mov:[],pres:{},metas:[]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||def()}catch(e){S=def()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s);
const cop=n=>new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}).format(n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const hoy=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
let mes=hoy().slice(0,7),tab='res';
const sum=a=>a.reduce((s,x)=>s+x.m,0);
const del=(arr,t)=>arr.filter(x=>x.t===t);
const delMes=k=>S.mov.filter(x=>x.f.startsWith(k));
const mk=o=>{const[y,m]=mes.split('-').map(Number);const d=new Date(y,m-1-o,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};

function nav(){$('#nav').innerHTML=TABS.map(t=>'<button data-tab="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+t[1]+'</button>').join('')}

function resumen(){
  const M=delMes(mes),inc=sum(del(M,'i')),exp=sum(del(M,'g')),tot=sum(del(S.mov,'i'))-sum(del(S.mov,'g'));
  const by={};del(M,'g').forEach(x=>by[x.c]=(by[x.c]||0)+x.m);
  const cats=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const ahorro=inc-exp;
  let h='<div class="grid"><div class="card"><div class="k">Balance total</div><div class="v num">'+cop(tot)+'</div></div>'+
  '<div class="card"><div class="k">Ahorro del mes</div><div class="v num '+(ahorro>=0?'in':'out')+'">'+cop(ahorro)+'</div></div>'+
  '<div class="card"><div class="k">Ingresos</div><div class="v num in">'+cop(inc)+'</div></div>'+
  '<div class="card"><div class="k">Gastos</div><div class="v num out">'+cop(exp)+'</div></div></div>';
  h+='<h2>En qué gastaste</h2><div class="card">'+(cats.length?cats.map(([c,v])=>'<div class="sm" style="display:flex;justify-content:space-between"><span>'+c+'</span><span class="num">'+cop(v)+' ('+Math.round(v/exp*100)+'%)</span></div><div class="bar"><i style="width:'+(v/exp*100)+'%"></i></div>').join(''):'<div class="empty">Aún no hay gastos este mes.</div>')+'</div>';
  const ms=[5,4,3,2,1,0].map(o=>{const k=mk(o),X=delMes(k);return{k,i:sum(del(X,'i')),g:sum(del(X,'g'))}});
  const mx=Math.max(1,...ms.flatMap(x=>[x.i,x.g]));
  h+='<h2>Últimos 6 meses</h2><div class="card"><svg viewBox="0 0 320 130" role="img" aria-label="Ingresos y gastos de los últimos 6 meses">'+
  ms.map((x,i)=>{const bx=8+i*52,hi=x.i/mx*90,hg=x.g/mx*90;
    return '<rect x="'+bx+'" y="'+(100-hi)+'" width="18" height="'+hi+'" rx="3" fill="var(--in)"/><rect x="'+(bx+21)+'" y="'+(100-hg)+'" width="18" height="'+hg+'" rx="3" fill="var(--out)"/><text x="'+(bx+20)+'" y="119" text-anchor="middle" font-size="10" fill="var(--soft)">'+x.k.slice(5)+'/'+x.k.slice(2,4)+'</text>'}).join('')+
  '</svg><div class="sm"><span class="in">■</span> Ingresos &nbsp; <span class="out">■</span> Gastos</div></div>';
  return h;
}

function movs(){
  const M=delMes(mes).sort((a,b)=>b.f.localeCompare(a.f)||b.id-a.id);
  return '<form id="fm"><select name="t"><option value="g">Gasto</option><option value="i">Ingreso</option></select>'+
  '<input name="m" type="number" inputmode="decimal" min="1" step="any" placeholder="Monto" required aria-label="Monto">'+
  '<select name="c" aria-label="Categoría">'+CATS.map(c=>'<option>'+c+'</option>').join('')+'</select>'+
  '<input name="f" type="date" value="'+hoy()+'" required aria-label="Fecha">'+
  '<input class="w" name="n" placeholder="Nota (opcional)" maxlength="60" aria-label="Nota"><button class="w">Agregar</button></form>'+
  '<h2>Movimientos del mes</h2><div class="card">'+(M.length?M.map(x=>'<div class="row"><div><div>'+(esc(x.n)||(x.t==='i'?'Ingreso':x.c))+'</div><div class="sm">'+x.f+' · '+(x.t==='i'?'Ingreso':x.c)+'</div></div><div><span class="num '+(x.t==='i'?'in':'out')+'">'+(x.t==='i'?'+':'−')+cop(x.m)+'</span><button class="g" data-del="'+x.id+'" aria-label="Borrar">✕</button></div></div>').join(''):'<div class="empty">Sin movimientos este mes. Agrega el primero arriba.</div>')+'</div>';
}

function presu(){
  const gm={};del(delMes(mes),'g').forEach(x=>gm[x.c]=(gm[x.c]||0)+x.m);
  return '<div class="sm" style="margin-bottom:.5rem">Define cuánto quieres gastar al mes en cada categoría. Se marca en rojo si te pasas.</div>'+
  CATS.map(c=>{const l=S.pres[c]||0,s=gm[c]||0,p=l?s/l*100:0;
    return '<div class="card" style="margin-bottom:.5rem"><div class="top" style="margin:0"><b>'+c+'</b><input data-lim="'+c+'" type="number" inputmode="decimal" min="0" value="'+(l||'')+'" placeholder="Límite mensual" style="width:9.5rem" aria-label="Límite de '+c+'"></div>'+
    (l?'<div class="bar"><i class="'+(p>100?'over':'')+'" style="width:'+Math.min(p,100)+'%"></i></div><div class="sm num">'+cop(s)+' de '+cop(l)+(p>100?' · te pasaste por '+cop(s-l):' · te quedan '+cop(l-s))+'</div>':'<div class="sm num">Gastado: '+cop(s)+'</div>')+'</div>'}).join('');
}

function metas(){
  return '<form id="fg"><input name="n" placeholder="Nombre de la meta (ej: viaje)" required maxlength="40" aria-label="Nombre"><input name="m" type="number" inputmode="decimal" min="1" placeholder="Monto objetivo" required aria-label="Objetivo"><button class="w">Crear meta</button></form>'+
  '<h2>Mis metas</h2>'+(S.metas.length?S.metas.map(g=>{const p=Math.min(100,g.a/g.m*100);
    return '<div class="card" style="margin-bottom:.5rem"><div class="top" style="margin:0"><b>'+esc(g.n)+'</b><button class="g" data-delm="'+g.id+'" aria-label="Borrar meta">✕</button></div><div class="bar"><i style="width:'+p+'%"></i></div><div class="sm num">'+cop(g.a)+' de '+cop(g.m)+' ('+Math.round(p)+'%)'+(g.a>=g.m?' · ¡Lograda!':'')+'</div>'+
    '<div class="mini"><input type="number" inputmode="decimal" min="1" placeholder="Aporte" data-ap="'+g.id+'" aria-label="Aporte"><button data-apb="'+g.id+'">Aportar</button></div></div>'}).join(''):'<div class="card empty">Crea tu primera meta de ahorro.</div>');
}

function render(){nav();$('#mes').value=mes;$('#v').innerHTML=({res:resumen,mov:movs,pre:presu,met:metas})[tab]()}

document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.tab){tab=d.tab;render()}
  else if(d.del){S.mov=S.mov.filter(x=>x.id!=d.del);save();render()}
  else if(d.delm){S.metas=S.metas.filter(x=>x.id!=d.delm);save();render()}
  else if(d.apb){const i=document.querySelector('[data-ap="'+d.apb+'"]'),v=+i.value;if(v>0){S.metas.find(x=>x.id==d.apb).a+=v;save();render()}}
});
document.addEventListener('submit',e=>{
  e.preventDefault();const f=new FormData(e.target);
  if(e.target.id==='fm'){const t=f.get('t');S.mov.push({id:Date.now(),t,m:+f.get('m'),c:t==='i'?'Ingreso':f.get('c'),f:f.get('f'),n:f.get('n')||''});save();mes=f.get('f').slice(0,7);render()}
  if(e.target.id==='fg'){S.metas.push({id:Date.now(),n:f.get('n'),m:+f.get('m'),a:0});save();render()}
});
document.addEventListener('change',e=>{
  if(e.target.id==='mes'&&e.target.value){mes=e.target.value;render()}
  if(e.target.dataset.lim){S.pres[e.target.dataset.lim]=+e.target.value||0;save();render()}
});
render();
</script>
</body>
</html>
